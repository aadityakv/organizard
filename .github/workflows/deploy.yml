name: Deploy Worker

# Server first, always: an old Worker rejects mutation types a newer client sends.
# Pushes to main that touch server/ or shared/ deploy to production after the
# tests pass; the manual trigger deploys either environment.
on:
  push:
    branches: [main]
    paths: ['server/**', 'shared/**']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_ENV: ${{ github.event.inputs.environment == 'staging' && '--env staging' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote $WRANGLER_ENV
      - name: Deploy
        run: npx wrangler deploy $WRANGLER_ENV
