name: Deploy Worker

# Server first, always: an old Worker rejects mutation types a newer client sends.
# Pushes to main that touch server/ or shared/ deploy to production after the
# tests pass; the manual trigger deploys either environment.
on:
  push:
    branches: [main]
    paths: ['server/**', 'shared/**']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_ENV: ${{ github.event.inputs.environment == 'staging' && '--env staging' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Until the Cloudflare secrets are configured, prove the build and stop here
      # rather than failing the run.
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping migrate + deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply D1 migrations
        if: steps.creds.outputs.present == 'true'
        run: npx wrangler d1 migrations apply DB --remote $WRANGLER_ENV
      - name: Deploy
        if: steps.creds.outputs.present == 'true'
        run: npx wrangler deploy $WRANGLER_ENV
