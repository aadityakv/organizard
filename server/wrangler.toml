name = "organizard-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Feature flags. Billing is OFF for now: sharing/sync/photos are free and no
# subscription (RevenueCat) is required. Flip to "true" to enforce "owner pays
# to share" once a paid tier ships.
[vars]
BILLING_ENABLED = "false"
# Audience the Apple identity token is verified against (native Sign in with Apple
# mints tokens with aud = the app bundle id). Without this, /v1/auth/apple 401s.
APPLE_BUNDLE_ID = "com.organizard.app"

# D1 — relational data.
[[d1_databases]]
binding = "DB"
database_name = "organizard"
database_id = "13ab5927-d543-4def-a44c-ac1fe7cb169e"
migrations_dir = "drizzle"

# R2 — photo blobs (shared moves only).
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "organizard-photos"

# KV — sessions + magic-link tokens.
[[kv_namespaces]]
binding = "SESSIONS"
id = "a5c68a99c85e428b863f10ee2df03eaa"

# Workers Logs: one line per request + console output, viewable in the Cloudflare
# dashboard and via `wrangler tail`. No code needed beyond the request-log middleware.
[observability]
enabled = true

# ---------------------------------------------------------------------------
# Staging: a separate Worker with its own data, targeted by the "preview" EAS
# profile (APP_ENV=staging) and by `wrangler deploy --env staging`. Create the
# resources once and paste the ids:
#   wrangler d1 create organizard-staging
#   wrangler kv namespace create SESSIONS --env staging
#   wrangler r2 bucket create organizard-photos-staging
# ---------------------------------------------------------------------------
[env.staging]
name = "organizard-api-staging"

[env.staging.vars]
BILLING_ENABLED = "false"
APPLE_BUNDLE_ID = "com.organizard.app"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "organizard-staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"
migrations_dir = "drizzle"

[[env.staging.r2_buckets]]
binding = "PHOTOS"
bucket_name = "organizard-photos-staging"

[[env.staging.kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_STAGING_KV_ID"

[env.staging.observability]
enabled = true
